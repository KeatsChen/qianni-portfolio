<!-- detail-loading:start -->
<style data-detail-loading>
.detail-boot{display:none}
.detail-motion-pending body > :not(.detail-boot){visibility:hidden}
.detail-motion-pending .detail-boot{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;background:#01010b;color:#fff;pointer-events:none}
.detail-boot-back{position:absolute;top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));display:grid;place-items:center;box-sizing:border-box;width:44px;height:44px;border:1px solid rgba(128,128,140,.35);border-radius:50%;background:rgba(128,128,140,.12);color:inherit;pointer-events:auto}
.detail-boot-back:focus-visible{outline:2px solid currentColor;outline-offset:4px}
.detail-boot-back span{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden;white-space:nowrap}
.detail-boot .project-entry-grid{display:grid;grid-area:1/1;grid-template-columns:repeat(3,10px);gap:6px;animation:detail-boot-exit 0s 8s forwards}
.detail-boot .project-entry-grid i{display:block;width:10px;height:10px;border-radius:50%;background:#fff;animation:project-entry-dot 1.5s ease-in-out var(--dot-delay) infinite}
.detail-boot-recovery{grid-area:1/1;visibility:hidden;text-align:center;padding:24px;font:16px/1.6 system-ui,sans-serif;animation:detail-boot-recover 0s 8s forwards}
.detail-boot-recovery a{pointer-events:auto;color:inherit;margin:0 10px}
.detail-boot [lang=zh],html:lang(zh) .detail-boot [lang=en]{display:none}
html:lang(zh) .detail-boot [lang=zh]{display:block}
@keyframes detail-boot-exit{to{visibility:hidden}}
@keyframes detail-boot-recover{to{visibility:visible}}
@keyframes project-entry-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.5)}}
@media(prefers-reduced-motion:reduce){.detail-boot .project-entry-grid i{animation:none;opacity:.65}}
</style>
<script>
window.detailMotionManaged=true;
document.documentElement.classList.add('detail-motion-pending');
</script>
<!-- detail-loading:end -->
<!-- detail-loading-body:start -->
<div class="detail-boot">
  <a class="detail-boot-back" href="{{backHref}}"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M9 2.5 4 7.5 9 12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span lang="en">Back to projects</span><span lang="zh">返回项目列表</span></a>
  <div class="project-entry-grid" aria-hidden="true">{{dots}}</div>
  <div class="detail-boot-recovery">
    <div lang="en"><p role="status">This project is taking longer than expected.</p><a href="">Retry</a></div>
    <div lang="zh"><p role="status">项目加载时间比预期长。</p><a href="">重试</a></div>
  </div>
</div>
<!-- detail-loading-body:end -->
